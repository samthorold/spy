[project]
name = "spy"
version = "0.1.0"
description = "Learn spanish by creating flashcards"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "attrs>=26.1.0",
    "cattrs>=26.2.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
