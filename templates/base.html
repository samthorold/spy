<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# 422 carries the re-rendered form with its errors: swap it in, but still count it as a failure. #}
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "422", "swap": true, "error": true},{"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": false, "error": true}, {"code": "...", "swap": false}]}'>
  <title>{% block title %}Spy{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx-2.0.11.min.js"></script>
</head>
<body hx-boost="true">
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
